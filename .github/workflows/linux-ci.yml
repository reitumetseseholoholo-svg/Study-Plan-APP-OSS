name: linux-ci

"on":
  pull_request: {}
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb
      - name: Install test/lint deps
        run: |
          python -m pip install --upgrade pip
          pip install pyright pytest
      - name: GTK lint
        run: python tools/gtk4_lint.py
      - name: Pyright
        run: pyright studyplan_app.py studyplan_ai_tutor.py studyplan_engine.py studyplan tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Unit tests
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: [lint-type, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb
      - name: Clean stale lock file
        run: rm -f ~/.config/studyplan/app_instance.lock
        continue-on-error: true
      - name: Strict dialog smoke
        run: xvfb-run -a timeout 300s python studyplan_app.py --dialog-smoke-strict
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: ~/.config/studyplan/smoke_last.json
          if-no-files-found: ignore
      - name: Upload app log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-log
          path: ~/.config/studyplan/app.log
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    needs: [lint-type, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Evaluate strict perf gate
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            REQUIRE_OLLAMA=1
          else
            REQUIRE_OLLAMA=0
          fi
          python tools/run_perf_benchmark.py \
            --prompts-file tests/fixtures/perf_prompts.json \
            --report perf_report.json \
            --require-ollama "${REQUIRE_OLLAMA}" \
            --allow-warn 0
        continue-on-error: true
      - name: Upload perf report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: perf_report.json
          if-no-files-found: ignore

  build-rust:
    runs-on: ubuntu-latest
    needs: [lint-type, unit]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install maturin
        run: pip install maturin
      - name: Build Rust crate
        run: maturin build --release --manifest-path studyplan/rs/Cargo.toml
      - name: Verify import
        run: |
          pip install studyplan/rs/target/wheels/studyplan_rs-*.whl
          python -c "from studyplan_rs import select_srs_from_scored; print('Rust module OK')"

  tutor-quality:
    runs-on: ubuntu-latest
    needs: [lint-type, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Select tutor quality policy
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            POLICY_NAME=strict_release
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            POLICY_NAME=balanced_main
          else
            POLICY_NAME=feature_relaxed
          fi
          echo "TUTOR_QUALITY_POLICY=${POLICY_NAME}" >> "${GITHUB_ENV}"
      - name: Run tutor quality reference gate
        run: |
          python tools/run_tutor_quality_pipeline.py \
            --mode reference \
            --matrix tests/tutor_quality/matrix_v1.json \
            --expected tests/tutor_quality/expected_scores_v1.json \
            --gates-file tests/tutor_quality/gates_v1.json \
            --baseline tests/tutor_quality/reference_report_v1.json \
            --model reference_baseline \
            --policy-file tests/tutor_quality/policy_profiles_v1.json \
            --policy "${TUTOR_QUALITY_POLICY}" \
            --output-dir .
        continue-on-error: true
      - name: Upload tutor quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-quality-report
          path: |
            tutor_quality_report.json
            tutor_quality_compare_report.json
            tutor_quality_trend_report.json
            tutor_quality_validate_report.json
            tutor_quality_pipeline_report.json
          if-no-files-found: ignore
