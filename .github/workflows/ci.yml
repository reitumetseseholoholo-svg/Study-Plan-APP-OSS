name: CI Quality Gates

on:
  push:
    branches: [main, develop]
    paths:
      - "studyplan/**/*.py"
      - "tests/**/*.py"
      - "studyplan/testing/**/*.py"
      - "studyplan_app.py"
      - "studyplan_ai_tutor.py"
      - "studyplan_engine.py"
      - "studyplan_file_safety.py"
      - "studyplan_app_path_utils.py"
      - "studyplan_app_kpi_routing.py"
      - "studyplan_ui_runtime.py"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "studyplan/**/*.py"
      - "tests/**/*.py"
      - "studyplan/testing/**/*.py"
      - "studyplan_app.py"
      - "studyplan_ai_tutor.py"
      - "studyplan_engine.py"
      - "studyplan_file_safety.py"
      - "studyplan_app_path_utils.py"
      - "studyplan_app_kpi_routing.py"
      - "studyplan_ui_runtime.py"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps (GTK4 for import tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0
        continue-on-error: true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-cov

      - name: Lint with ruff
        run: |
          ruff check studyplan/ tests/ studyplan/testing/

      - name: Type check with pyright
        run: |
          pyright studyplan/

      - name: Run pytest (core + integration)
        run: |
          pytest tests/ studyplan/testing/ -q --tb=short

      - name: Check test coverage
        run: |
          pytest tests/ --cov=studyplan --cov-report=term-missing --cov-fail-under=40

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit for security issues
        run: |
          bandit -r studyplan/ -ll
        continue-on-error: true
